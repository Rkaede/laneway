on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # Uses the workflow's built-in token, so there is no secret to
          # rotate. It needs "Allow GitHub Actions to create and approve pull
          # requests" turned on in the repository's Actions settings.
          # this is a built-in strategy in release-please, see "Action Inputs"
          # for more options
          release-type: simple
